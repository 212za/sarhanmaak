<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سرحان معك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- استيراد مكتبة PDF.js لقراءة ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- استيراد مكتبات Firebase عبر CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMpZ7CXOJbgKpMqOjzsbbCcpHBlslU3mw",
            authDomain: "salah-52496.firebaseapp.com",
            databaseURL: "https://salah-52496-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "salah-52496",
            storageBucket: "salah-52496.appspot.com",
            messagingSenderId: "235427387836",
            appId: "1:235427387836:web:26da71074fb1b9c403f3b9",
            measurementId: "G-LTGB3X7DLQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                console.log("تم تسجيل الدخول بنجاح:", user.displayName);
                alert(`أهلاً بك يا ${user.displayName}! تم تسجيل الدخول بنجاح.`);
            } catch (error) {
                console.error("خطأ في تسجيل الدخول:", error);
                alert("حدث خطأ أثناء تسجيل الدخول، حاول مرة أخرى.");
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('loginBtnText');
            if (user) {
                if (loginBtn) loginBtn.innerText = user.displayName.split(' ')[0];
            } else {
                if (loginBtn) loginBtn.innerText = "تسجيل الدخول بجوجل";
            }
        });
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], },
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        cardBorder: '#1e293b',
                        accentBlue: '#3b82f6',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #0b0f19; 
            color: #f8fafc; 
            overflow-x: hidden; 
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #0b0f19;
            overflow: hidden;
        }

        .animated-bg::before, .animated-bg::after {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(139, 92, 246, 0.08));
            border-radius: 50%;
            filter: blur(100px);
            animation: floatGlow 15s ease-in-out infinite alternate;
        }

        .animated-bg::after {
            background: linear-gradient(225deg, rgba(59, 130, 246, 0.05), rgba(236, 72, 153, 0.08));
            animation-duration: 20s;
            animation-delay: -5s;
        }

        @keyframes floatGlow {
            0% { transform: translate(-20%, -20%) scale(1); }
            100% { transform: translate(20%, 20%) scale(1.1); }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: moveParticle linear infinite;
        }

        @keyframes moveParticle {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        .custom-glass { 
            background: rgba(19, 28, 46, 0.75); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between selection:bg-blue-500 selection:text-white">
    <div class="animated-bg">
        <div class="particles">
            <script>
                for(let i=0; i<15; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.width = Math.random() * 5 + 2 + 'px';
                    p.style.height = p.style.width;
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = Math.random() * 100 + '%';
                    p.style.animationDuration = Math.random() * 10 + 5 + 's';
                    p.style.animationDelay = Math.random() * 5 + 's';
                    document.querySelector('.particles').appendChild(p);
                }
            </script>
        </div>
    </div>

    <header class="w-full px-6 py-4 flex justify-between items-center custom-glass border-b border-cardBorder sticky top-0 z-50">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-brain text-white text-lg"></i>
            </div>
            <span class="text-xl font-black bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">سرحان معك</span>
        </div>
        <button onclick="loginWithGoogle()" class="flex items-center space-x-2 space-x-reverse bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl border border-slate-700 transition-all duration-300 shadow-sm cursor-pointer">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
            <span id="loginBtnText" class="text-sm font-semibold">تسجيل الدخول بجوجل</span>
        </button>
    </header>

    <main class="container mx-auto px-4 py-10 max-w-4xl flex-grow flex flex-col justify-center">
        <div id="mainSection" class="transition-all duration-300">
            <div class="text-center mb-10 space-y-3">
                <h1 class="text-4xl md:text-5xl font-black tracking-tight leading-tight">
                    ارفع ملفك، ودعنا <span class="bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">نزهلك</span>
                </h1>
                <p class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto">
                    شرح، ترجمة، أسئلة وأجوبة، ومحادثة تفاعلية صُممت خصيصاً لتناسب احتياجاتك بأعلى احترافية وسرعة.
                </p>
            </div>

            <div class="custom-glass rounded-3xl p-6 md:p-8 shadow-2xl space-y-8 border border-slate-800">
                <div class="space-y-4">
                    <label class="block text-sm font-bold text-slate-300">1. ارفع الملف الخاص بك أو اكتب النص مباشرة</label>
                    
                    <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-2xl p-6 text-center cursor-pointer transition-all duration-300 bg-slate-900/40 hover:bg-slate-900/70 group">
                        <input type="file" id="fileInput" class="hidden" accept=".pdf,.txt,.docx" onchange="handleFileSelect(event)">
                        <div class="flex flex-col items-center space-y-3 pointer-events-none">
                            <div class="w-12 h-12 rounded-full bg-blue-600/10 text-blue-400 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                                <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                            </div>
                            <div>
                                <p class="text-slate-200 font-bold" id="fileNameDisplay">اسحب الملف هنا أو اضغط للاختيار</p>
                                <p class="text-xs text-slate-500 mt-1">يدعم ملفات PDF، DOCX، TXT حتى 50MB</p>
                            </div>
                        </div>
                    </div>

                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-slate-700"></div>
                        <span class="flex-shrink mx-4 text-slate-500 text-sm font-bold">أو</span>
                        <div class="flex-grow border-t border-slate-700"></div>
                    </div>

                    <div>
                        <textarea id="manualTextInput" placeholder="أو يمكنك كتابة أو لصق النص هنا مباشرة..." class="w-full h-32 bg-slate-900/60 border border-slate-700 focus:border-blue-500 p-4 rounded-xl text-sm focus:outline-none text-white transition-all resize-y" oninput="handleManualText(this.value)"></textarea>
                    </div>

                    <div id="fileContentPreviewContainer" class="hidden mt-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700 max-h-48 overflow-y-auto text-right">
                        <p class="text-xs text-blue-400 font-bold mb-1">المحتوى المعالج:</p>
                        <p id="fileContentPreviewText" class="text-xs text-slate-300 whitespace-pre-wrap leading-relaxed"></p>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-sm font-bold text-slate-300">2. اختر نوع المعالجة المطلوبة</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                        <button type="button" onclick="selectTask('summary')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group cursor-pointer" data-task="summary">
                            <span class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-file-lines"></i>
                            </span>
                            <span class="text-sm font-semibold text-slate-200">تلخيص شامل</span>
                        </button>
                        <button type="button" onclick="selectTask('translate')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group cursor-pointer" data-task="translate">
                            <span class="w-8 h-8 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center group-hover:bg-purple-500 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-language"></i>
                            </span>
                            <span class="text-sm font-semibold text-slate-200">ترجمة النص</span>
                        </button>
                        <button type="button" onclick="selectTask('written_explain')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group cursor-pointer" data-task="written_explain">
                            <span class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-book-open"></i>
                            </span>
                            <span class="text-sm font-semibold text-slate-200">شرح كتابي</span>
                        </button>
                    </div>
                </div>

                <div id="summaryOptions" class="hidden space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                    <label class="block text-sm font-bold text-slate-300">اختر لغة التلخيص الشامل:</label>
                    <div class="flex items-center space-x-6 space-x-reverse">
                        <label class="flex items-center space-x-2 space-x-reverse text-slate-300 cursor-pointer">
                            <input type="radio" name="summaryLang" value="ar" checked class="accent-blue-500"> <span>ملخص بالعربية</span>
                        </label>
                        <label class="flex items-center space-x-2 space-x-reverse text-slate-300 cursor-pointer">
                            <input type="radio" name="summaryLang" value="en" class="accent-blue-500"> <span>ملخص بالإنجليزية</span>
                        </label>
                    </div>
                </div>

                <button onclick="processFile()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white font-bold text-lg shadow-lg shadow-blue-600/25 hover:shadow-purple-600/40 hover:scale-[1.01] active:scale-[0.99] transition-all duration-300 cursor-pointer flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span>بدء المعالجة الذكية</span>
                </button>
            </div>
        </div>

        <div id="resultSection" class="hidden space-y-6">
            <div class="flex justify-between items-center custom-glass px-6 py-4 rounded-2xl border border-slate-800">
                <button onclick="goBack()" class="flex items-center space-x-2 space-x-reverse bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl transition cursor-pointer text-sm font-bold">
                    <i class="fa-solid fa-arrow-right"></i> <span>رجوع للرئيسية</span>
                </button>
                <h2 id="resultTitle" class="text-lg font-bold text-blue-400">نتيجة التحليل</h2>
                <button onclick="copyResult()" class="text-xs bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-500/30 px-3 py-2 rounded-xl transition cursor-pointer">
                    <i class="fa-solid fa-copy ml-1"></i> نسخ المحتوى
                </button>
            </div>
            <div id="resultBody" class="custom-glass rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-800 space-y-4 text-slate-200 leading-relaxed">
            </div>
        </div>
    </main>

    <script>
        let currentSelectedTask = '';
        let uploadedFileObject = null;
        let fileTextContent = '';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('border-blue-500', 'bg-slate-900/80');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-blue-500', 'bg-slate-900/80');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect({ target: fileInput });
            }
        });

        function handleManualText(text) {
            fileTextContent = text;
            uploadedFileObject = { name: "النص المكتوب يدوياً" };
            const previewContainer = document.getElementById('fileContentPreviewContainer');
            const previewText = document.getElementById('fileContentPreviewText');
            
            if (text.trim() !== "") {
                previewText.innerText = text.substring(0, 1000) + (text.length > 1000 ? "\n...(تم إظهار جزء من النص)..." : "");
                previewContainer.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
            }
        }

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadedFileObject = file;
                document.getElementById('fileNameDisplay').innerHTML = `الملف المختار: <span class="text-blue-400 font-bold">${file.name}</span>`;
                
                const previewContainer = document.getElementById('fileContentPreviewContainer');
                const previewText = document.getElementById('fileContentPreviewText');
                previewText.innerText = "جاري استخراج وقراءة محتوى الملف...";
                previewContainer.classList.remove('hidden');

                if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                        const pdfDoc = await loadingTask.promise;
                        let fullText = '';
                        
                        for (let i = 1; i <= pdfDoc.numPages; i++) {
                            const page = await pdfDoc.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(' ');
                            fullText += pageText + '\n';
                        }
                        fileTextContent = fullText;
                        previewText.innerText = fullText.substring(0, 1000) + (fullText.length > 1000 ? "\n...(تم إظهار جزء من النص)..." : "");
                    } catch (error) {
                        console.error("خطأ في قراءة ملف الـ PDF:", error);
                        previewText.innerText = "حدث خطأ أثناء قراءة ملف الـ PDF، تأكد من أن الملف سليم.";
                    }
                } else {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        fileTextContent = e.target.result;
                        previewText.innerText = fileTextContent.substring(0, 1000) + (fileTextContent.length > 1000 ? "\n...(تم إظهار جزء من النص)..." : "");
                    };
                    reader.readAsText(file);
                }
            }
        }

        async function callGeminiAPI(promptText) {
            try {
                const response = await fetch('/api/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Error:", error);
                return null;
            }
        }

        function selectTask(taskType) {
            currentSelectedTask = taskType;
            const buttons = document.querySelectorAll('.task-btn');
            buttons.forEach(btn => {
                btn.classList.remove('border-blue-500', 'bg-blue-600/10', 'shadow-lg');
                btn.classList.add('border-slate-800', 'bg-slate-900/60');
            });
            const selectedBtn = document.querySelector(`[data-task="${taskType}"]`);
            if (selectedBtn) {
                selectedBtn.classList.remove('border-slate-800', 'bg-slate-900/60');
                selectedBtn.classList.add('border-blue-500', 'bg-blue-600/10', 'shadow-lg');
            }
            document.getElementById('summaryOptions').classList.toggle('hidden', taskType !== 'summary');
        }

        async function processFile() {
            if (!fileTextContent.trim()) {
                alert('الرجاء اختيار ملف أو كتابة نص أولاً!');
                return;
            }
            if (!currentSelectedTask) {
                alert('الرجاء اختيار نوع المعالجة المطلوبة أولاً!');
                return;
            }

            document.getElementById('mainSection').classList.add('hidden');
            const resultSection = document.getElementById('resultSection');
            resultSection.classList.remove('hidden');

            const resultTitle = document.getElementById('resultTitle');
            const resultBody = document.getElementById('resultBody');

            resultTitle.innerText = "جاري التحليل...";
            resultBody.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 space-y-4">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-400"></i>
                    <p class="text-slate-400 text-sm">جاري معالجة النص وتطبيق مهمة (${getTaskName(currentSelectedTask)})...</p>
                </div>
            `;

            let promptInstruction = `قم بمعالجة النص التالي:\n\n${fileTextContent.substring(0, 15000)}`;

            if (currentSelectedTask === 'summary') {
                const lang = document.querySelector('input[name="summaryLang"]:checked').value;
                const langText = lang === 'en' ? 'الإنجليزية' : 'العربية';
                promptInstruction += ` قم بعمل تلخيص شامل واحترافي له باللغة ${langText}.`;
            } else if (currentSelectedTask === 'translate') {
                promptInstruction += " قم بترجمة هذا النص بدقة كاملة إلى اللغة العربية.";
            } else if (currentSelectedTask === 'written_explain') {
                promptInstruction += " قدم شرحاً كتابياً مفصلاً وواضحاً لهذا النص.";
            }

            const apiResponse = await callGeminiAPI(promptInstruction);
            renderTaskResult(currentSelectedTask, uploadedFileObject ? uploadedFileObject.name : "النص المدخل", apiResponse);
        }

        function getTaskName(task) {
            switch(task) {
                case 'summary': return 'التلخيص الشامل';
                case 'translate': return 'ترجمة النص';
                case 'written_explain': return 'الشرح الكتابي';
                default: return 'معالجة';
            }
        }

        function renderTaskResult(task, fileName, apiData) {
            let apiOutput = "حدث خطأ أثناء تحميل النتيجة من الخادم.";
            if (apiData && apiData.candidates && apiData.candidates[0] && apiData.candidates[0].content && apiData.candidates[0].content.parts && apiData.candidates[0].content.parts[0].text) {
                apiOutput = apiData.candidates[0].content.parts[0].text;
            }

            const resultTitle = document.getElementById('resultTitle');
            const resultBody = document.getElementById('resultBody');
            resultTitle.innerText = `نتيجة: ${getTaskName(task)}`;

            if (task === 'summary' || task === 'translate' || task === 'written_explain') {
                resultBody.innerHTML = `
                    <h3 class="text-xl font-black text-blue-400 border-b border-cardBorder pb-3"><i class="fa-solid fa-file-lines ml-2"></i> ${getTaskName(task)}</h3>
                    <div class="space-y-3 text-sm text-slate-300 leading-loose">${apiOutput.replace(/\n/g, '<br>')}</div>
                `;
            }
        }

        function goBack() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
        }

        function copyResult() {
            const content = document.getElementById('resultBody').innerText;
            navigator.clipboard.writeText(content);
            alert('تم نسخ محتوى النتيجة بنجاح!');
        }
    </script>
</body>
</html>
