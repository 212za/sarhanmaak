<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سرحان معك</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استيراد مكتبات Firebase عبر CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMpZ7CXOJbgKpMqOjzsbbCcpHBlslU3mw",
      authDomain: "salah-52496.firebaseapp.com",
      databaseURL: "https://salah-52496-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "salah-52496",
      storageBucket: "salah-52496.appspot.com",
      messagingSenderId: "235427387836",
      appId: "1:235427387836:web:26da71074fb1b9c403f3b9",
      measurementId: "G-LTGB3X7DLQ"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // ربط الدالة بالنافذة العامة ليمكن استدعاؤها من الأزرار
    window.loginWithGoogle = async function() {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        console.log("تم تسجيل الدخول بنجاح:", user.displayName);
        alert(`أهلاً بك يا ${user.displayName}! تم تسجيل الدخول بنجاح.`);
      } catch (error) {
        console.error("خطأ في تسجيل الدخول:", error);
        alert("حدث خطأ أثناء تسجيل الدخول، حاول مرة أخرى.");
      }
    };

    // متابعة حالة المستخدم (هل هو مسجل دخول أم لا)
    onAuthStateChanged(auth, (user) => {
      const loginBtn = document.getElementById('loginBtnText');
      if (user) {
        if (loginBtn) loginBtn.innerText = user.displayName.split(' ')[0]; // إظهار الاسم الأول
      } else {
        if (loginBtn) loginBtn.innerText = "تسجيل الدخول بجوجل";
      }
    });
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          },
          colors: {
            darkBg: '#0b0f19',
            cardBg: '#131c2e',
            cardBorder: '#1e293b',
            accentBlue: '#3b82f6',
            accentPurple: '#8b5cf6',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .glow-bg {
      position: absolute;
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.15));
      filter: blur(100px);
      border-radius: 50%;
      z-index: -1;
      animation: floatGlow 10s ease-in-out infinite alternate;
    }
    @keyframes floatGlow {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(30px) scale(1.1); }
    }
    .custom-glass {
      background: rgba(19, 28, 46, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between selection:bg-blue-500 selection:text-white">
  <div class="glow-bg top-10 left-10"></div>
  <div class="glow-bg bottom-10 right-10" style="animation-delay: 5s;"></div>
  
  <header class="w-full px-6 py-4 flex justify-between items-center custom-glass border-b border-cardBorder sticky top-0 z-50">
    <div class="flex items-center space-x-3 space-x-reverse">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
        <i class="fa-solid fa-brain text-white text-lg"></i>
      </div>
      <span class="text-xl font-black bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">سرحان معك</span>
    </div>
    <button onclick="loginWithGoogle()" class="flex items-center space-x-2 space-x-reverse bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl border border-slate-700 transition-all duration-300 shadow-sm cursor-pointer">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
      <span id="loginBtnText" class="text-sm font-semibold">تسجيل الدخول بجوجل</span>
    </button>
  </header>

  <main class="container mx-auto px-4 py-10 max-w-4xl flex-grow flex flex-col justify-center">
    <div id="mainSection" class="transition-all duration-300">
      <div class="text-center mb-10 space-y-3">
        <h1 class="text-4xl md:text-5xl font-black tracking-tight leading-tight">
          ارفع ملفك، ودعنا <span class="bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">نزهلك</span>
        </h1>
        <p class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto">
          شرح، ترجمة، أسئلة وأجوبة، ومحادثة تفاعلية صُممت خصيصاً لتناسب احتياجاتك بأعلى احترافية وسرعة.
        </p>
      </div>

      <div class="custom-glass rounded-3xl p-6 md:p-8 shadow-2xl space-y-8 border border-slate-800">
        <div class="space-y-2">
          <label class="block text-sm font-bold text-slate-300">1. ارفع الملف الخاص بك (PDF, Word, TXT)</label>
          <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 bg-slate-900/40 hover:bg-slate-900/70 group">
            <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
            <div class="flex flex-col items-center space-y-3 pointer-events-none">
              <div class="w-16 h-16 rounded-full bg-blue-600/10 text-blue-400 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
              </div>
              <div>
                <p class="text-slate-200 font-bold" id="fileNameDisplay">اسحب الملف هنا أو اضغط للاختيار</p>
                <p class="text-xs text-slate-500 mt-1">يدعم ملفات PDF، DOCX، TXT حتى 50MB</p>
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <label class="block text-sm font-bold text-slate-300">2. اختر نوع المعالجة المطلوبة</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            <button type="button" onclick="selectTask('summary')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group cursor-pointer" data-task="summary">
              <span class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors">
                <i class="fa-solid fa-file-lines"></i>
              </span>
              <span class="text-sm font-semibold text-slate-200">تلخيص شامل للملف</span>
            </button>
            <button type="button" onclick="selectTask('translate')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group cursor-pointer" data-task="translate">
              <span class="w-8 h-8 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center group-hover:bg-purple-500 group-hover:text-white transition-colors">
                <i class="fa-solid fa-language"></i>
              </span>
              <span class="text-sm font-semibold text-slate-200">ترجمة الملف</span>
            </button>
            <button type="button" onclick="selectTask('written_explain')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group cursor-pointer" data-task="written_explain">
              <span class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-white transition-colors">
                <i class="fa-solid fa-book-open"></i>
              </span>
              <span class="text-sm font-semibold text-slate-200">شرح كتابي</span>
            </button>
            <button type="button" onclick="selectTask('questions_only')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group cursor-pointer" data-task="questions_only">
              <span class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                <i class="fa-solid fa-circle-question"></i>
              </span>
              <span class="text-sm font-semibold text-slate-200">أسئلة فقط بدون امتحان</span>
            </button>
            <button type="button" onclick="selectTask('chat')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group cursor-pointer" data-task="chat">
              <span class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                <i class="fa-solid fa-comments"></i>
              </span>
              <span class="text-sm font-semibold text-slate-200">محادثة وشرح تفاعلي (اسألني)</span>
            </button>
            <button type="button" onclick="selectTask('exam')" class="task-btn p-4 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 text-right transition-all duration-200 flex items-center space-x-3 space-x-reverse group sm:col-span-2 md:col-span-1 cursor-pointer" data-task="exam">
              <span class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center group-hover:bg-rose-500 group-hover:text-white transition-colors">
                <i class="fa-solid fa-graduation-cap"></i>
              </span>
              <span class="text-sm font-semibold text-slate-200">امتحان تفاعلي (اختيار عدد الأسئلة)</span>
            </button>
          </div>
        </div>

        <div id="summaryOptions" class="hidden space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
          <label class="block text-sm font-bold text-slate-300">اختر لغة التلخيص الشامل:</label>
          <div class="flex items-center space-x-6 space-x-reverse">
            <label class="flex items-center space-x-2 space-x-reverse text-slate-300 cursor-pointer">
              <input type="radio" name="summaryLang" value="ar" checked class="accent-blue-500"> <span>ملخص بالعربية</span>
            </label>
            <label class="flex items-center space-x-2 space-x-reverse text-slate-300 cursor-pointer">
              <input type="radio" name="summaryLang" value="en" class="accent-blue-500"> <span>ملخص بالإنجليزية (English Summary)</span>
            </label>
          </div>
        </div>

        <div id="examSettings" class="hidden space-y-2 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
          <label class="block text-sm font-bold text-slate-300">حدد عدد أسئلة الامتحان:</label>
          <div class="flex items-center space-x-4 space-x-reverse">
            <input type="range" id="questionCount" min="3" max="20" value="5" class="w-full accent-blue-500 cursor-pointer" oninput="document.getElementById('countVal').innerText = this.value">
            <span id="countVal" class="bg-blue-600/20 text-blue-400 font-bold px-3 py-1 rounded-lg border border-blue-500/30 text-sm">5</span>
          </div>
        </div>

        <button onclick="processFile()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white font-bold text-lg shadow-lg shadow-blue-600/25 hover:shadow-purple-600/40 hover:scale-[1.01] active:scale-[0.99] transition-all duration-300 cursor-pointer flex items-center justify-center space-x-2 space-x-reverse">
          <i class="fa-solid fa-wand-magic-sparkles"></i> <span>بدء المعالجة الذكية</span>
        </button>
      </div>
    </div>

    <div id="resultSection" class="hidden space-y-6">
      <div class="flex justify-between items-center custom-glass px-6 py-4 rounded-2xl border border-slate-800">
        <button onclick="goBack()" class="flex items-center space-x-2 space-x-reverse bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl transition cursor-pointer text-sm font-bold">
          <i class="fa-solid fa-arrow-right"></i> <span>رجوع للرئيسية</span>
        </button>
        <h2 id="resultTitle" class="text-lg font-bold text-blue-400">نتيجة التحليل</h2>
        <button onclick="copyResult()" class="text-xs bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-500/30 px-3 py-2 rounded-xl transition cursor-pointer">
          <i class="fa-solid fa-copy ml-1"></i> نسخ المحتوى
        </button>
      </div>
      <div id="resultBody" class="custom-glass rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-800 space-y-4 text-slate-200 leading-relaxed">
      </div>
    </div>
  </main>

  <script>
    let currentSelectedTask = '';
    let uploadedFileObject = null;
    let fileTextContent = '';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('border-blue-500', 'bg-slate-900/80');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-blue-500', 'bg-slate-900/80');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        fileInput.files = files;
        handleFileSelect({ target: fileInput });
      }
    });

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        uploadedFileObject = file;
        document.getElementById('fileNameDisplay').innerHTML = `الملف المختار: <span class="text-blue-400 font-bold">${file.name}</span>`;
        const reader = new FileReader();
        reader.onload = function(e) {
          fileTextContent = e.target.result;
        };
        reader.readAsText(file);
      }
    }

    function selectTask(taskType) {
      currentSelectedTask = taskType;
      const buttons = document.querySelectorAll('.task-btn');
      buttons.forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-600/10', 'shadow-lg');
        btn.classList.add('border-slate-800', 'bg-slate-900/60');
      });
      const selectedBtn = document.querySelector(`[data-task="${taskType}"]`);
      if(selectedBtn) {
        selectedBtn.classList.remove('border-slate-800', 'bg-slate-900/60');
        selectedBtn.classList.add('border-blue-500', 'bg-blue-600/10', 'shadow-lg');
      }
      document.getElementById('summaryOptions').classList.toggle('hidden', taskType !== 'summary');
      document.getElementById('examSettings').classList.toggle('hidden', taskType !== 'exam');
    }

    async function callGeminiAPI(promptText) {
      try {
        const response = await fetch('/.netlify/functions/api', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt: promptText })
        });
        const data = await response.json();
        return data;
      } catch (error) {
        console.error("Error:", error);
        return null;
      }
    }

    async function processFile() {
      if (!fileInput.files.length) {
        alert('الرجاء اختيار أو سحب ملف أولاً!');
        return;
      }
      if (!currentSelectedTask) {
        alert('الرجاء اختيار نوع المعالجة المطلوبة أولاً!');
        return;
      }
      document.getElementById('mainSection').classList.add('hidden');
      const resultSection = document.getElementById('resultSection');
      resultSection.classList.remove('hidden');
      const resultTitle = document.getElementById('resultTitle');
      const resultBody = document.getElementById('resultBody');
      resultTitle.innerText = "جاري تحليل الملف...";
      resultBody.innerHTML = `
        <div class="flex flex-col items-center justify-center py-12 space-y-4">
          <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-400"></i>
          <p class="text-slate-400 text-sm">جاري قراءة محتوى الملف وتطبيق مهمة (${getTaskName(currentSelectedTask)})...</p>
        </div>
      `;
      let promptInstruction = `قم بمعالجة الملف المسمى ${uploadedFileObject.name} والمحتوى التالي: ${fileTextContent.substring(0, 2000)}`;
      if (currentSelectedTask === 'summary') {
        promptInstruction += " قم بعمل تلخيص شامل واحترافي له.";
      } else if (currentSelectedTask === 'translate') {
        promptInstruction += " قم بترجمة محتوى هذا الملف بدقة كاملة إلى اللغة العربية.";
      } else if (currentSelectedTask === 'written_explain') {
        promptInstruction += " قدم شرحاً كتابياً مفصلاً وواضحاً لهذا المحتوى.";
      } else if (currentSelectedTask === 'questions_only') {
        promptInstruction += " استخرج أهم الأسئلة الهامة بناءً على هذا المحتوى.";
      } else if (currentSelectedTask === 'exam') {
        const count = document.getElementById('questionCount').value;
        promptInstruction += ` أنشئ امتحان تفاعلي مكون من ${count} أسئلة اختيار من متعدد مع الإجابات الصحيحة.`;
      }
      const apiResponse = await callGeminiAPI(promptInstruction);
      setTimeout(() => {
        renderTaskResult(currentSelectedTask, uploadedFileObject.name, apiResponse);
      }, 1000);
    }

    function getTaskName(task) {
      switch(task) {
        case 'summary': return 'التلخيص الشامل للملف';
        case 'translate': return 'ترجمة الملف';
        case 'written_explain': return 'الشرح الكتابي للملف';
        case 'questions_only': return 'أسئلة فقط بدون امتحان';
        case 'chat': return 'محادثة وشرح تفاعلي';
        case 'exam': return 'امتحان تفاعلي';
        default: return 'معالجة';
      }
    }

    function renderTaskResult(task, fileName, apiData) {
      let apiOutput = "حدث خطأ أثناء تحميل النتيجة من الخادم.";
      
      if (apiData && apiData.candidates && apiData.candidates[0] && apiData.candidates[0].content && apiData.candidates[0].content.parts && apiData.candidates[0].content.parts[0].text) {
        apiOutput = apiData.candidates[0].content.parts[0].text;
      }
      
      const resultTitle = document.getElementById('resultTitle');
      const resultBody = document.getElementById('resultBody');
      resultTitle.innerText = `نتيجة: ${getTaskName(task)} (${fileName})`;
      if (task === 'summary') {
        const lang = document.querySelector('input[name="summaryLang"]:checked').value;
        const langText = lang === 'en' ? 'الإنجليزية' : 'العربية';
        resultBody.innerHTML = `
          <h3 class="text-xl font-black text-blue-400 border-b border-cardBorder pb-3"><i class="fa-solid fa-file-lines ml-2"></i> التلخيص الشامل (باللغة ${langText})</h3>
          <div class="space-y-3 text-sm text-slate-300">
            <p>${apiOutput}</p>
          </div>
        `;
      } else if (task === 'translate') {
        resultBody.innerHTML = `
          <h3 class="text-xl font-black text-purple-400 border-b border-cardBorder pb-3"><i class="fa-solid fa-language ml-2"></i> ترجمة احترافية للملف</h3>
          <div class="space-y-3 text-sm text-slate-300">
            <p class="bg-slate-900/50 p-4 rounded-xl border border-cardBorder">${apiOutput}</p>
          </div>
        `;
      } else if (task === 'written_explain') {
        resultBody.innerHTML = `
          <h3 class="text-xl font-black text-amber-400 border-b border-cardBorder pb-3"><i class="fa-solid fa-book-open ml-2"></i> الشرح الكتابي المفصل</h3>
          <div class="space-y-3 text-sm text-slate-300">
            <p>${apiOutput}</p>
          </div>
        `;
      } else if (task === 'questions_only') {
        resultBody.innerHTML = `
          <h3 class="text-xl font-black text-indigo-400 border-b border-cardBorder pb-3"><i class="fa-solid fa-circle-question ml-2"></i> مجموعة الأسئلة الهامة</h3>
          <div class="space-y-3 text-sm text-slate-300">
            <p>${apiOutput}</p>
          </div>
        `;
      } else if (task === 'chat') {
        resultBody.innerHTML = `
          <h3 class="text-xl font-black text-emerald-400 border-b border-cardBorder pb-3"><i class="fa-solid fa-comments ml-2"></i> محادثة الشرح والتفاعل الشفوي</h3>
          <p class="text-xs text-slate-400">اطرح أي سؤال حول محتوى الملف وسيقوم النظام بشرحه لك وتوضيحه بالتفصيل:</p>
          <div id="chatMessages" class="bg-slate-900/60 p-4 rounded-2xl border border-cardBorder h-64 overflow-y-auto space-y-3 text-sm">
            <div class="bg-blue-600/20 text-blue-200 p-3 rounded-xl max-w-[80%] border border-blue-500/30">
              أهلاً بك يا صلاح! أنا جاهز لمناقشة محتوى ملف <strong>${fileName}</strong> معك. ما هي النقطة أو الجزء الذي تريد أن نشرحه بالتفصيل؟
            </div>
          </div>
          <div class="flex space-x-2 space-x-reverse pt-2">
            <input type="text" id="userQuestionInput" placeholder="اكتب سؤالك هنا (مثال: اشرح لي الجزء الأول...)" class="flex-grow bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white" onkeypress="if(event.key === 'Enter') sendChatMessage()">
            <button onclick="sendChatMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl text-white font-bold transition cursor-pointer">
              <i class="fa-solid fa-paper-plane"></i> ارسال
            </button>
          </div>
        `;
      } else if (task === 'exam') {
        resultBody.innerHTML = `
          <h3 class="text-xl font-black text-rose-400 border-b border-cardBorder pb-3"><i class="fa-solid fa-graduation-cap ml-2"></i> امتحان تفاعلي</h3>
          <div class="space-y-4 text-sm">
            <p>${apiOutput}</p>
          </div>
        `;
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('userQuestionInput');
      const chatMessages = document.getElementById('chatMessages');
      const questionText = input.value.trim();
      if (!questionText) return;

      chatMessages.innerHTML += `
        <div class="bg-slate-800 text-slate-100 p-3 rounded-xl max-w-[80%] mr-auto border border-slate-700">
          ${questionText}
        </div>
      `;
      input.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const responseData = await callGeminiAPI(questionText);
      let botReply = "تعذر الحصول على رد من الذكاء الاصطناعي.";
      if (responseData && responseData.candidates && responseData.candidates[0] && responseData.candidates[0].content && responseData.candidates[0].content.parts && responseData.candidates[0].content.parts[0].text) {
        botReply = responseData.candidates[0].content.parts[0].text;
      }
      
      setTimeout(() => {
        chatMessages.innerHTML += `
          <div class="bg-blue-600/20 text-blue-200 p-3 rounded-xl max-w-[80%] border border-blue-500/30">
            ${botReply}
          </div>
        `;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 500);
    }

    function goBack() {
      document.getElementById('resultSection').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');
    }

    function copyResult() {
      const content = document.getElementById('resultBody').innerText;
      navigator.clipboard.writeText(content);
      alert('تم نسخ محتوى النتيجة بنجاح!');
    }
  </script>
</body>
</html>
